name: Build and Deploy RED ZONE 3D Web

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_VERSION="4.4.1"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/web_release.zip"

      - name: Export versioned Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web
          BUILD_ID="${GITHUB_SHA::7}"
          GAME_FILE="redzone-${BUILD_ID}.html"
          godot --headless --path . --verbose --export-release "Web" "build/web/${GAME_FILE}"
          cat > build/web/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=./${GAME_FILE}">
            <title>RED ZONE 3D</title>
          </head>
          <body style="margin:0;background:#111;color:#fff;font:16px sans-serif">
            <p>Loading RED ZONE 3D…</p>
            <script>location.replace("./${GAME_FILE}");</script>
          </body>
          </html>
          EOF

      - name: Verify web files
        run: |
          test -s build/web/index.html
          find build/web -maxdepth 1 -type f -printf '%f\n'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
